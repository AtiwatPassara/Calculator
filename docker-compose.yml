version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=db
      - DB_USER=Atiwat
      - DB_PASSWORD=Pee/54666
      - DB_NAME=calculatordb
    depends_on:
      - db

  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: Pee/54666
      MYSQL_DATABASE: calculatordb
      MYSQL_USER: Atiwat
      MYSQL_PASSWORD: Pee/54666
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./calculatordb_dump.sql:/docker-entrypoint-initdb.d/calculatordb_dump.sql

volumes:
  db_data:
