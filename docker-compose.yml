version: '3.8'

services:
  db:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Pee/54666
      MYSQL_DATABASE: calculatordb
      MYSQL_USER: 'Atiwat'
      MYSQL_PASSWORD: 'Pee/54666'
    ports:
      - "3307:3306"  # Change host port to avoid conflicts if needed
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - my-network

  app:
    build:
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"  # Change the host port to avoid conflicts if needed
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.docker
    depends_on:
      - db
    networks:
      - my-network

networks:
  my-network:

volumes:
  db_data:
